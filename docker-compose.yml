services:
  # db est sous profile « pg » (spec 2026-11-25, D-1) : le mode SQLite
  # (docker-compose.sqlite.yml) n'a pas de service de base de données.
  # PG reste le défaut — le wrapper scripts/compose-up.sh et
  # scripts/deploy_server.sh lancent avec --profile pg.
  db:
    image: postgres:19-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: checklists
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: checklists
    volumes:
      # PG19 : l'image stocke les données dans un sous-dossier de
      # /var/lib/postgresql (layout 18+) — le volume va donc à la racine.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checklists"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://checklists:${DB_PASSWORD}@db:5432/checklists
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # --- Email (invitations, partages, notifications) ---
      SMTP_ENABLED: ${SMTP_ENABLED:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-tapitask@localhost}
      # --- Rate limiting multi-workers (optionnel) ---
      REDIS_URL: ${REDIS_URL:-}
      # Variables de config.py absentes de l'environment (audit C1.4) :
      # sans ce pass-through, les valeurs par défaut du code ne peuvent pas
      # être réglées en production.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      PRINCIPAL_RATE_LIMIT_PER_MINUTE: ${PRINCIPAL_RATE_LIMIT_PER_MINUTE:-300}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-30.0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOKS_MAX_PER_LIST: ${WEBHOOKS_MAX_PER_LIST:-10}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    ports:
      # API en clair : écoute loopback par défaut (reverse proxy local).
      # API_BIND=0.0.0.0 uniquement derrière un pare-feu.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  # Webapp (optionnel) : --profile web
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./app/build/web:/usr/share/nginx/html:ro
    networks: [internal]
    ports:
      # Web en clair : écoute loopback par défaut, comme l'API (audit lot T).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    profiles: ["web"]

  # TLS intégré (optionnel) : --profile caddy
  # Par défaut, l'API est exposée sur ${API_PORT} pour ton propre reverse proxy.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    profiles: ["caddy"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
