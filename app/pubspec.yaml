name: tapitask
description: Tapitask — offline-first checklists (Windows tray, Android widget, self-hosted sync).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.6
  path: ^1.9.0
  http: ^1.2.2
  # Justification unique d'une nouvelle dépendance (spec §B.5) :
  # décompression du zip de self-update Windows, pure Dart.
  archive: ^3.6.1
  shared_preferences: ^2.5.6
  # Tokens de session en stockage sécurisé (audit lot T) ; web supporté via
  # flutter_secure_storage_web (pas d'import conditionnel nécessaire).
  flutter_secure_storage: ^11.2.0
  tray_manager: ^0.9.0
  window_manager: ^0.7.0
  flutter_local_notifications: ^23.0.1
  home_widget: ^0.10.0
  web_socket_channel: ^3.0.1
  # M6 (D-4, prod4) : remplacement de dart:html (deprecated) dans
  # update_opener_web.dart — déjà présent en transitif dans pubspec.lock.
  web: ^1.1.2
  # Justification unique d'une nouvelle dépendance (spec 2026-11-25, D-7) :
  # import/export — picker de fichier natif
  # (android/web/windows) ; aucun picker de fichier n'existait dans l'app.
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/
