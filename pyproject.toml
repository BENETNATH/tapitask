# L1 (prod4, D-7) : config ruff racine — le gate pre-push cherche
# pyproject.toml dans « . » et couvre donc server/ (pas de config dedans).
[tool.ruff]
target-version = "py312"
line-length = 88
# specs/ hors périmètre (D-7 : « ne formater que le code, pas specs/ ») —
# ruff format toucherait les blocs ```python des spec markdowns.
extend-exclude = ["specs/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
